[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airesearcher"
version = "0.1.0"
description = "DSA4213 Group 6: AI Researcher Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
# 真实调用大模型时才需要；用假实现（fake）跑流程不需要
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
air = "airesearcher.cli.main:app"

[tool.setuptools.packages.find]
include = ["airesearcher*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # UP042：文档约定用 (str, Enum)

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
